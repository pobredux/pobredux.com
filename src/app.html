<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/icon.png" />
    <link rel="preload" href="/assets/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        var root = document.documentElement;
        var d = navigator.userAgentData;
        var s = ((d && d.platform) || navigator.platform || "") + " " + navigator.userAgent;
        root.dataset.os =
          /Windows|Win32|Win64/i.test(s) ? "windows"
          : /Android|iPhone|iPad|iPod/i.test(s) ? "other"
          : /Mac/i.test(s) ? "mac"
          : /Linux|X11|CrOS/i.test(s) ? "linux"
          : "other";
        root.dataset.arch = /aarch64|arm64|armv8|armv7/i.test(s) ? "arm64" : "x64";
        var t = null;
        try {
          t = localStorage.getItem("pobredux:theme");
        } catch (e) {}
        if (t !== "system") {
          root.dataset.theme = t === "light" ? "light" : "dark";
          var c = t === "light" ? "#fbfaf7" : "#0b0b0c";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = c;
          });
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
